<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3d2e"/>
      <stop offset="50%" stop-color="#14523a"/>
      <stop offset="100%" stop-color="#07291f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Amber Icon Container -->
  <g filter="url(#shadow)">
    <rect x="106" y="96" width="300" height="230" rx="48" fill="url(#amberGrad)"/>
  </g>

  <!-- Steam Lines -->
  <path d="M 216 140 Q 206 120 216 100" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 256 136 Q 246 114 256 94" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
  <path d="M 296 140 Q 286 120 296 100" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- Food / Curry Bowl Icon Inside Amber Box -->
  <!-- Bowl Base -->
  <path d="M 166 195 Q 166 280 256 280 Q 346 280 346 195 Z" fill="#0b3d2e"/>
  <!-- Food Rim / Rice Dome -->
  <ellipse cx="256" cy="195" rx="80" ry="24" fill="#faf8f4"/>
  <!-- Curry / Garnish detail -->
  <ellipse cx="256" cy="195" rx="55" ry="15" fill="#f59e0b"/>
  <circle cx="256" cy="193" r="8" fill="#10b981"/>

  <!-- DRS Typography -->
  <text x="256" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="4">DRS</text>
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#f59e0b" letter-spacing="3">QUICK SERVE</text>
</svg>

