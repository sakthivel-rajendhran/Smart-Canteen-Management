<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — DRS Quick Serve</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #faf8f4;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    .badge-icon {
      width: 72px;
      height: 72px;
      background: #0b3d2e;
      color: #f59e0b;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px -4px rgba(11, 61, 46, 0.3);
    }
    h1 {
      color: #0b3d2e;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .notice {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: left;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary {
      background: #0b3d2e;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #14523a;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #0b3d2e;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-icon">🍛</div>
    <h1>You're Currently Offline</h1>
    <p>
      DRS Quick Serve couldn't reach the college canteen server. Please check your mobile data or Wi-Fi network.
    </p>

    <div class="notice">
      🔒 <strong>Notice:</strong> For security and inventory accuracy, live order placement and payment checkouts require an active internet connection.
    </div>

    <div class="actions">
      <button onclick="window.location.reload()" class="btn btn-primary">
        🔄 Retry Connection
      </button>
      <a href="/menu" class="btn btn-secondary">
        🍽️ Browse Cached Menu
      </a>
    </div>
  </div>
</body>
</html>
